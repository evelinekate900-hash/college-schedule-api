name: Обновление расписания

on:
  schedule:
    # Запуск каждый день в 21:00 по UTC (это 06:00 утра по Якутску)
    - cron: '0 21 * * *'
  workflow_dispatch: # Кнопка для ручного запуска из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: pip install pandas requests openpyxl tzdata

      - name: Запуск парсера
        run: python parser.py

      - name: Сохранение результата в репозиторий
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add schedule.json
          git commit -m "Автообновление расписания" || exit 0
          git push
          
